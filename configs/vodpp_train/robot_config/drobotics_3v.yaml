# @package _global_
# D-Robotics dual-arm robot: left/right wrist + head cameras, 14-DoF state/action.
image_shape: [3, 240, 320]
shape_meta:
  obs:
    left_cam:
      shape: ${image_shape}
      type: rgb
    right_cam:
      shape: ${image_shape}
      type: rgb
    head_cam:
      shape: ${image_shape}
      type: rgb
    state:
      shape: [14]
      type: low_dim
  action:
    state:
      shape: [14]

n_obs_steps: 1
obs_image_frame_indices: ${eval:'ListConfig(list(range(${n_obs_steps})))'}
n_action_steps: ${eval:'${horizon}-${n_obs_steps}'}

model:
  shape_meta: ${shape_meta}
  action_key: state
  obs_encoder:
    # rgb_key and multi-view settings are owned by observation_config/*.yaml.
    state_key: null
    emvis_config:
      processor_config:
        do_resize: false
